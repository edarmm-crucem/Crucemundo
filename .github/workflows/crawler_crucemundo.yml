name: Actualizar Crucemundo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'
concurrency:
  group: crucemundo-crawler
  cancel-in-progress: false
jobs:
  crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar credenciales de Google (si están)
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 || '' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS || '' }}
        run: |
          set -euxo pipefail
          # Prefer base64-encoded secret to avoid newline issues
          if [ -n "${GOOGLE_CREDENTIALS_B64}" ]; then
            echo "Decodificando GOOGLE_CREDENTIALS_B64 -> credentials.json"
            echo "${GOOGLE_CREDENTIALS_B64}" | base64 --decode > credentials.json
            chmod 600 credentials.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=credentials.json" >> $GITHUB_ENV
          elif [ -n "${GOOGLE_CREDENTIALS}" ]; then
            echo "Escribiendo credentials.json desde secret GOOGLE_CREDENTIALS"
            printf '%s' "${GOOGLE_CREDENTIALS}" > credentials.json
            chmod 600 credentials.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=credentials.json" >> $GITHUB_ENV
          else
            echo "No se encontró el secret GOOGLE_CREDENTIALS ni GOOGLE_CREDENTIALS_B64; se ejecutará sin credenciales de GCP."
          fi

      - name: (temporal) Validar credentials.json y mostrar client_email
        if: always()
        run: |
          set -euxo pipefail
          if [ -f credentials.json ]; then
            echo "Validando credentials.json (mostrando solo client_email)"
            python -c "import json,sys; j=json.load(open('credentials.json')); print('client_email:', j.get('client_email'))"
          else
            echo "No hay credentials.json"
          fi

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar librerías
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright beautifulsoup4 google-api-python-client google-auth google-auth-oauthlib google-cloud-storage unidecode
          # instalar browsers y dependencias del sistema
          python -m playwright install --with-deps

      - name: Ejecutar crawler
        env:
          CRUCEMUNDO_DOC_ID: ${{ secrets.CRUCEMUNDO_DOC_ID || '' }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET || '' }}
        run: |
          set -euxo pipefail
          echo "Archivos en workspace antes de ejecutar:"
          ls -la
          # Ejecutar con credenciales si existen
          if [ -f credentials.json ]; then
            echo "Ejecutando crawler con service account (intentará subir visited_urls a Drive/GCS)"
            python crawler_crucemundo.py \
              --out crawler_output.txt \
              --urls-out visited_urls.txt \
              --upload-urls-drive \
              --upload-urls-gcs \
              --google-key credentials.json \
              --document-id "${CRUCEMUNDO_DOC_ID}" \
              --gcs-bucket "${GCS_BUCKET}" \
              --headless
          else
            echo "No hay credentials.json: ejecutando crawler en modo local (solo salida local)"
            python crawler_crucemundo.py \
              --out crawler_output.txt \
              --urls-out visited_urls.txt \
              --headless
          fi

      - name: Sanity check output
        if: always()
        run: |
          set -euxo pipefail
          echo ">>>> Workspace: $PWD <<<<"
          ls -la || true
          echo ">>>> Ficheros crawler_output.txt* <<<<"
          ls -lh crawler_output.txt crawler_output.txt.gz || true
          echo ">>>> Fichero visited_urls.txt (si existe) <<<<"
          ls -lh visited_urls.txt visited_urls.txt.gz || true
          echo ">>>> Primeras 200 líneas crawler_output.txt (si existen) <<<<"
          head -n 200 crawler_output.txt || true
          echo ">>>> Primeras 200 líneas visited_urls.txt (si existen) <<<<"
          head -n 200 visited_urls.txt || true

      - name: Compress output (opcional)
        if: always()
        run: |
          set -euxo pipefail
          if [ -f crawler_output.txt ]; then
            gzip -c crawler_output.txt > crawler_output.txt.gz
            echo "Compressed crawler_output.txt -> crawler_output.txt.gz"
          else
            echo "No existe crawler_output.txt para comprimir"
          fi
          if [ -f visited_urls.txt ]; then
            gzip -c visited_urls.txt > visited_urls.txt.gz
            echo "Compressed visited_urls.txt -> visited_urls.txt.gz"
          else
            echo "No existe visited_urls.txt para comprimir"
          fi
          ls -lh crawler_output.txt* visited_urls.txt* || true

      - name: Upload crawler output artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-output
          path: |
            crawler_output.txt.gz
            crawler_output.txt
            visited_urls.txt.gz
            visited_urls.txt
          retention-days: 30
